<header class="site-header">
  <div class="container header-inner">
    <a class="brand" routerLink="/" aria-label="LoanCalc RD, ir al inicio">
      <img class="brand-isotipo" src="/assets/img/isotipo-loancalc-rd-256.webp" alt="" width="36" height="36" decoding="async" />
      <span class="brand-name">LoanCalc <b>RD</b></span>
    </a>

    <nav class="main-nav" [class.with-account]="auth.enabled" aria-label="Navegación principal">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" ariaCurrentWhenActive="page">
        <i class="bi bi-house" aria-hidden="true"></i><span>Inicio</span>
      </a>
      <a routerLink="/calculator" routerLinkActive="active" ariaCurrentWhenActive="page">
        <i class="bi bi-calculator" aria-hidden="true"></i><span>Calculadora</span>
      </a>
      <a routerLink="/guide" routerLinkActive="active" ariaCurrentWhenActive="page">
        <i class="bi bi-journal-text" aria-hidden="true"></i><span>Guía</span>
      </a>
      @if (auth.enabled) {
        @if (auth.isAuthenticated()) {
          <a class="cloud-nav-link" routerLink="/account/simulations" routerLinkActive="active" ariaCurrentWhenActive="page">
            <i class="bi bi-cloud-check" aria-hidden="true"></i><span>Mis simulaciones</span>
          </a>
          <a class="account-link signed-in" routerLink="/account/security" routerLinkActive="active" ariaCurrentWhenActive="page"
             [attr.title]="auth.profile()?.email">
            <i class="bi bi-person-check" aria-hidden="true"></i><span class="label-long">Mi cuenta</span>
            <span class="visually-hidden">(sesión iniciada como {{ auth.profile()?.email }})</span>
          </a>
        } @else {
          <a class="account-link" routerLink="/account" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" ariaCurrentWhenActive="page">
            <i class="bi bi-person-circle" aria-hidden="true"></i><span class="label-long">Iniciar sesión</span><span class="label-short" aria-hidden="true">Entrar</span>
          </a>
        }
      }
    </nav>
  </div>
</header>
