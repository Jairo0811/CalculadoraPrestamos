services:
  postgres:
    image: postgres:17-alpine
    container_name: loancalcrd-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: loancalcrd
      POSTGRES_USER: loancalc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-loancalc_dev}
    ports:
      - "5432:5432"
    volumes:
      - loancalcrd_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loancalc -d loancalcrd"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  loancalcrd_postgres_data:
