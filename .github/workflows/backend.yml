name: LoanCalc RD Backend CI

on:
  push:
    branches:
      - feature/v3-phase-5-backend
      - feature/v3-phase-6-auth-security
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  # Siempre en Pull Requests: "backend" es un check obligatorio de la protección de `master`.
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: loancalcrd
          POSTGRES_USER: loancalc
          POSTGRES_PASSWORD: loancalc_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U loancalc -d loancalcrd"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      ConnectionStrings__LoanCalcDb: Host=localhost;Port=5432;Database=loancalcrd;Username=loancalc;Password=loancalc_ci
      Jwt__SigningKey: ci-test-only-secret-key-not-for-production-2026-xxxxxxxx
      ASPNETCORE_ENVIRONMENT: Development

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore backend
        run: |
          dotnet restore backend/src/LoanCalcRD.Api/LoanCalcRD.Api.csproj
          dotnet restore backend/tests/LoanCalcRD.Tests/LoanCalcRD.Tests.csproj

      - name: Build backend
        run: dotnet build backend/src/LoanCalcRD.Api/LoanCalcRD.Api.csproj --configuration Release --no-restore

      - name: Install EF Core CLI
        run: dotnet tool install --global dotnet-ef --version 10.0.14

      - name: Verify upgrade path from a Phase 5 database
        env:
          PGPASSWORD: loancalc_ci
          UPGRADE_DB: Host=localhost;Port=5432;Database=loancalcrd_upgrade;Username=loancalc;Password=loancalc_ci
        run: |
          set -euo pipefail
          EF="--project backend/src/LoanCalcRD.Infrastructure/LoanCalcRD.Infrastructure.csproj --startup-project backend/src/LoanCalcRD.Api/LoanCalcRD.Api.csproj --configuration Release"
          psql -h localhost -U loancalc -d loancalcrd -v ON_ERROR_STOP=1 -c "CREATE DATABASE loancalcrd_upgrade"
          # 1) Base en el estado exacto de la Fase 5.
          dotnet ef database update 20260902193000_InitialCreate $EF --connection "$UPGRADE_DB"
          psql -h localhost -U loancalc -d loancalcrd_upgrade -v ON_ERROR_STOP=1 -c \
            "INSERT INTO loan_simulations (\"Id\",\"UserId\",\"Name\",\"LoanType\",\"Amount\",\"AnnualRate\",\"TermMonths\",\"IsFavorite\",\"CreatedAtUtc\",\"UpdatedAtUtc\")
             VALUES ('11111111-1111-1111-1111-111111111111','22222222-2222-2222-2222-222222222222','Simulación Fase 5','Personal',250000.00,18.0000,36,true,now(),now())"
          # 2) Actualizar a la última migración (Identity + sesiones revocables) sin perder datos.
          dotnet ef database update $EF --connection "$UPGRADE_DB"
          COUNT=$(psql -h localhost -U loancalc -d loancalcrd_upgrade -tAc \
            "SELECT count(*) FROM loan_simulations WHERE \"Id\"='11111111-1111-1111-1111-111111111111' AND \"Amount\"=250000.00 AND \"IsFavorite\"")
          test "$COUNT" = "1" || { echo "La simulación de Fase 5 no se conservó"; exit 1; }
          psql -h localhost -U loancalc -d loancalcrd_upgrade -tAc 'SELECT "MigrationId" FROM "__EFMigrationsHistory" ORDER BY 1'
          # 3) Las migraciones también deben revertirse limpiamente hasta la Fase 5.
          dotnet ef database update 20260902193000_InitialCreate $EF --connection "$UPGRADE_DB"
          COUNT=$(psql -h localhost -U loancalc -d loancalcrd_upgrade -tAc "SELECT count(*) FROM loan_simulations")
          test "$COUNT" = "1" || { echo "El rollback perdió datos de simulaciones"; exit 1; }

      - name: Apply PostgreSQL migrations
        run: >-
          dotnet ef database update
          --project backend/src/LoanCalcRD.Infrastructure/LoanCalcRD.Infrastructure.csproj
          --startup-project backend/src/LoanCalcRD.Api/LoanCalcRD.Api.csproj
          --configuration Release

      - name: Verify migration state
        run: >-
          dotnet ef migrations list
          --project backend/src/LoanCalcRD.Infrastructure/LoanCalcRD.Infrastructure.csproj
          --startup-project backend/src/LoanCalcRD.Api/LoanCalcRD.Api.csproj
          --configuration Release

      - name: Run backend tests (xUnit against PostgreSQL 17)
        run: >-
          dotnet test backend/tests/LoanCalcRD.Tests/LoanCalcRD.Tests.csproj
          --configuration Release --no-restore
          --logger "console;verbosity=normal"
          --logger "trx;LogFileName=backend-tests.trx"
          --results-directory TestResults

      - name: Check NuGet packages for known vulnerabilities
        run: |
          set -euo pipefail
          dotnet list backend/src/LoanCalcRD.Api/LoanCalcRD.Api.csproj package --vulnerable --include-transitive | tee vulnerable.txt
          dotnet list backend/tests/LoanCalcRD.Tests/LoanCalcRD.Tests.csproj package --vulnerable --include-transitive | tee -a vulnerable.txt
          if grep -qE "\b(High|Critical)\b" vulnerable.txt; then echo "Hay dependencias con vulnerabilidades altas o críticas"; exit 1; fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: TestResults/*.trx
          if-no-files-found: ignore

