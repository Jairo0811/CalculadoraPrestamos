# Temporary one-off workflow for coherent Angular v22 lockfile generation.
# This workflow is removed from the PR once package-lock.json is committed.
name: Prepare Angular 22 lockfile
on:
  push:
    branches: [upgrade/angular22-full-migration]
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: calculadora-prestamos
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: npm
          cache-dependency-path: calculadora-prestamos/package-lock.json
      - name: Regenerate package-lock from coordinated Angular 22 dependency ranges
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          node - <<'JS'
          const p = require('./package-lock.json').packages;
          for (const dep of ['@angular/core', '@angular/cli', '@angular/build', '@angular/ssr','@angular/compiler-cli']) {
            const got=p['node_modules/'+dep]?.version;
            if (!got?.startsWith('22.')) throw new Error(dep+' version mismatch: '+got);
            console.log(dep + ': ' + got);
          }
          const ts=p['node_modules/typescript']?.version;
          if (!ts?.startsWith('6.0.'))throw new Error('TypeScript must be v6.0, got '+ts);
          const vitest=p['node_modules/vitest']?.version;
          if(!vitest?.startsWith('5.'))throw new Error('Vitest must be v5, got '+vitest);
          console.log('typescript: '+ts+', vitest: '+vitest);
          JS
      - name: Check reproducible install
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Commit updated lockfile to this migration branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add calculadora-prestamos/package-lock.json
          if git diff --cached --quiet; then
            echo "No lockfile changes"
          else
            git commit -m "chore(deps): regenerate Angular 22 lockfile"
            git push origin HEAD:upgrade/angular22-full-migration
          fi
