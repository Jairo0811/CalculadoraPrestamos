name: LoanCalc RD CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: calculadora-prestamos

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: npm
          cache-dependency-path: calculadora-prestamos/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate

      - name: Run automated tests
        run: npm run test:ci

      - name: Test AdSense integration (safe defaults and release gates)
        run: npm run test:adsense

      - name: Build Angular project
        run: npm run build

      - name: Validate WhatsApp and social link preview metadata
        run: node scripts/check-social-preview.mjs

  e2e:
    runs-on: ubuntu-latest
    needs: test-and-build

    defaults:
      run:
        working-directory: calculadora-prestamos

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: npm
          cache-dependency-path: calculadora-prestamos/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end tests (UI + accessibility, simulated account API)
        run: npm run e2e

      - name: Build production bundle (same command as Cloudflare Pages)
        run: npm run build

      - name: Smoke test the production build (accounts off, exports, SPA fallback)
        run: npm run e2e:smoke

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: calculadora-prestamos/test-results
          retention-days: 7
