name: LoanCalc RD Cloudflare Verify

# Verifica el despliegue real de Cloudflare Pages. No despliega ni almacena tokens.
on:
  push:
    branches: ["master"]
    paths:
      - 'calculadora-prestamos/**'
      - '.github/workflows/cloudflare-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-verify-${{ github.ref }}
  cancel-in-progress: true

env:
  PRODUCTION_URL: https://loancalcrd.pages.dev

jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Wait until Cloudflare Pages serves this commit
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            json=$(curl -fsSL --max-time 12 "${PRODUCTION_URL}/build-info.json?check=${attempt}" || true)
            published=$(echo "$json" | jq -r 'select(.app=="loancalc-rd") | .commit // empty' 2>/dev/null || true)
            echo "Intento $attempt: publicado=${published:-desconocido} esperado=$EXPECTED_COMMIT"
            if [ "$published" = "$EXPECTED_COMMIT" ]; then
              echo "Cloudflare Pages sirvió el commit esperado."
              exit 0
            fi
            sleep 15
          done
          echo "::error::Cloudflare Pages no publicó el commit $EXPECTED_COMMIT. Verifica auto-deploy, rama master, configuración del build y dominio."
          exit 1

      - name: Verify public HTML, OG metadata and image
        run: |
          set -euo pipefail
          curl -fsSL --max-time 20 "${PRODUCTION_URL}/" -o /tmp/loancalc-index.html
          grep -Fq '<meta property="og:title"' /tmp/loancalc-index.html
          grep -Fq "https://loancalcrd.pages.dev/" /tmp/loancalc-index.html
          grep -Fq 'property="og:image"' /tmp/loancalc-index.html
          grep -Fq 'name="twitter:card"' /tmp/loancalc-index.html
          curl -fsSL --max-time 20 "${PRODUCTION_URL}/assets/img/logo-loancalc-rd-900.webp" -o /tmp/loancalc-preview.webp
          file /tmp/loancalc-preview.webp
          file /tmp/loancalc-preview.webp | grep -q 'Web/P image'
          test "$(stat -c%s /tmp/loancalc-preview.webp)" -lt 600000
          echo "HTML e imagen OG de Cloudflare accesibles."

      - name: Summary
        if: always()
        run: |
          echo "### Cloudflare Pages" >> "$GITHUB_STEP_SUMMARY"
          echo "- Sitio: ${PRODUCTION_URL}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Verificación: ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
